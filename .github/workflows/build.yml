# Rebuilds the dataset from its public sources weekly (and by hand), commits what changed and, when the
# HF_TOKEN secret is set, mirrors the repository to Hugging Face (dhammagift/dg-dataset). On the first run of a quarter
# (January, April, July, October), if the data changed since the last release, it also makes a release (vYYYY.MM),
# which Zenodo archives with a new DOI version: weekly data, quarterly DOIs (owner 2026-10-20: no releases by hand,
# none when nothing changed; every Zenodo version stays forever, so not more often).
name: build
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
concurrency: build
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    # job level: a step's own env is not visible to that step's `if`
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sources
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/dhammagift/offline-data.git ../od
          git -C ../od sparse-checkout set dhammagift/translation/ru
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/suttacentral/sc-data.git ../scd
          git -C ../scd sparse-checkout set sc_bilara_data/root/pli/ms
          git clone -q --depth 1 https://github.com/dhammagift/dg-docs.git ../docs
      - name: Build
        run: python3 build.py --offline-data ../od --pali-root ../scd/sc_bilara_data/root/pli/ms --docs ../docs
      - name: Commit
        run: |
          git add -A data texts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name=dg-dataset-bot -c user.email=agiftofdhamma@gmail.com commit -qm "Data rebuilt from the sources"
          git push
      - name: Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          pip install -q huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()  # reads HF_TOKEN from the environment
          api.create_repo('dhammagift/dg-dataset', repo_type='dataset', exist_ok=True)
          api.upload_folder(repo_id='dhammagift/dg-dataset', repo_type='dataset', folder_path='.',
                            allow_patterns=['README.md', 'LICENSE', 'build.py', 'data/*', 'texts/**'])
          "
      - name: Quarterly release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%d)" -le 7 ] && [ $(( ($(date -u +%-m) - 1) % 3 )) -eq 0 ] || { echo "not the quarter's first run"; exit 0; }
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- data texts; then echo "no changes since $last"; exit 0; fi
          tag=v$(date -u +%Y.%m)
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" --notes "Dhamma.Gift dataset $tag: data rebuilt from the sources since ${last:-the start}. https://dhamma.gift"
